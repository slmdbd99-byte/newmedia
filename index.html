<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>基于SEI的时尚传播与新媒体运营课程数智平台</title><meta name="description" content="《时尚传播与新媒体运营》基于SEI的时尚传播与新媒体运营课程数智平台：课程大纲、团队项目、市场定位、商业模式画布、盈利模式识别、商业计划书、AI模拟投资人追问、SEI评分、价值外溢、品牌传播、运营财务、成绩评价与课堂数据看板"><style>
:root{
 --pearl:#FAF6F0; --pearl2:#F3ECE0; --card:#FFFFFF; --ink:#2B2622; --brown:#5A4632;
 --orange:#C75B1E; --orange2:#E07B2E; --orangeSoft:#F6E7D7; --sage:#72805C; --sageSoft:#E8EDE0;
 --gold:#9A7B2E; --navy:#2E4A6B; --brick:#8E4A3C; --taupe:#9C7A5C;
 --line:#E6DCCB; --line2:#EFE7D9; --grey:#6B6660; --greyL:#8C867E; --white:#fff;
 --sh:0 6px 20px rgba(150,120,80,.14); --sh2:0 2px 8px rgba(150,120,80,.1);
 --r:14px; --rs:10px;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei","微软雅黑",-apple-system,"Segoe UI",system-ui,sans-serif;
 background:var(--pearl); color:var(--ink); line-height:1.6; -webkit-font-smoothing:antialiased; font-size:15px;}
a{color:var(--orange); text-decoration:none} a:hover{text-decoration:underline}
button{font-family:inherit; cursor:pointer}
.hidden{display:none !important}
/* ---------- buttons ---------- */
.btn{display:inline-flex; align-items:center; gap:7px; border:none; border-radius:var(--rs); padding:10px 18px; font-size:14px; font-weight:600; background:var(--orange); color:#fff; transition:.15s; box-shadow:var(--sh2)}
.btn:hover{background:#b24f15; text-decoration:none}
.btn.ghost{background:var(--white); color:var(--brown); border:1px solid var(--line)}
.btn.ghost:hover{background:var(--pearl2)}
.btn.sage{background:var(--sage)} .btn.sage:hover{background:#5d6a49}
.btn.sm{padding:7px 13px; font-size:13px}
.btn.block{width:100%; justify-content:center}
input,select,textarea{font-family:inherit; font-size:14px; width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:var(--rs); background:#fff; color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--orange)}
textarea{resize:vertical; min-height:88px; line-height:1.55}
label{font-size:13px; font-weight:600; color:var(--brown); display:block; margin:0 0 5px}
.field{margin-bottom:14px}
/* ---------- auth ---------- */
#auth{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
 background:radial-gradient(1200px 500px at 70% -10%, #fbeede 0, var(--pearl) 55%)}
.authcard{width:100%; max-width:430px; background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--sh); padding:30px 26px}
.authhead{text-align:center; margin-bottom:18px}
.tabs{display:flex; gap:6px; background:var(--pearl2); padding:5px; border-radius:var(--rs); margin-bottom:18px}
.tabs button{flex:1; border:none; background:transparent; padding:9px; border-radius:8px; font-weight:600; color:var(--grey); font-size:14px}
.tabs button.on{background:#fff; color:var(--orange); box-shadow:var(--sh2)}
.hint{font-size:12.5px; color:var(--greyL); margin-top:6px}
.role-pick{display:flex; gap:8px; margin-bottom:14px}
.role-pick label{flex:1; margin:0; border:1px solid var(--line); border-radius:var(--rs); padding:10px; text-align:center; cursor:pointer; font-weight:600; color:var(--grey)}
.role-pick input{display:none}
.role-pick input:checked + span{color:var(--orange)}
.role-pick label:has(input:checked){border-color:var(--orange); background:var(--orangeSoft)}
.codebox{display:flex; gap:8px} .codebox .btn{white-space:nowrap}
.msg{font-size:13px; padding:9px 12px; border-radius:var(--rs); margin-bottom:12px}
.msg.err{background:#fbe9e7; color:#b23a2e} .msg.ok{background:var(--sageSoft); color:#4f6137}
.preset{font-size:12px; color:var(--greyL); background:var(--pearl2); border-radius:var(--rs); padding:10px 12px; margin-top:14px; line-height:1.7}
/* ---------- app shell ---------- */
#app{display:none; min-height:100vh}
.topbar{position:sticky; top:0; z-index:40; height:58px; background:rgba(250,246,240,.92); backdrop-filter:blur(8px);
 border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; padding:0 18px}
.topbar .brand{display:flex; align-items:center; gap:10px; font-weight:800; color:var(--ink); font-size:16px}
.topbar .sp{flex:1}
.usermenu{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--brown)}
.badge{font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; background:var(--orangeSoft); color:var(--orange)}
.badge.t{background:var(--sageSoft); color:var(--sage)} .badge.a{background:#e9e2f0; color:#6b4f8e}
.shell{display:flex; align-items:flex-start}
.side{width:210px; flex:none; position:sticky; top:58px; height:calc(100vh - 58px); overflow-y:auto; background:var(--pearl2); border-right:1px solid var(--line); padding:14px 10px}
.side a{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:var(--rs); color:var(--brown); font-weight:600; font-size:14px; margin-bottom:3px}
.side a:hover{background:#fff; text-decoration:none}
.side a.on{background:var(--orange); color:#fff; box-shadow:var(--sh2)}
.side a .ic{width:20px; text-align:center}
.side .seclabel{font-size:11px; color:var(--greyL); font-weight:700; letter-spacing:.05em; padding:12px 12px 6px}
.main{flex:1; min-width:0; padding:22px 26px 60px}
.crumb{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap}
.crumb .btn{padding:7px 13px; font-size:13px}
h1.page{font-size:24px; font-weight:800; margin:2px 0 4px; letter-spacing:-.01em}
.sub{color:var(--grey); font-size:14px; margin-bottom:18px}
/* ---------- cards / grid ---------- */
.grid{display:grid; gap:16px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:18px; box-shadow:var(--sh2)}
.card h3{margin:0 0 8px; font-size:16px}
.card.soft{background:var(--orangeSoft); border-color:#eccfb3}
.card.sagec{background:var(--sageSoft); border-color:#d6ddc8}
.tile{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:18px; text-align:center; box-shadow:var(--sh2)}
.tile .num{font-size:38px; font-weight:800; color:var(--orange); line-height:1.1}
.tile .lab{font-size:13px; color:var(--brown); margin-top:6px}
.modcard{display:block; background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:18px; box-shadow:var(--sh2); transition:.15s; color:var(--ink)}
.modcard:hover{transform:translateY(-2px); box-shadow:var(--sh); text-decoration:none; border-color:#e0c9ab}
.modcard .ic{font-size:26px} .modcard h3{margin:10px 0 5px; font-size:16px; color:var(--ink)}
.modcard p{margin:0; font-size:13px; color:var(--grey)}
.pill{display:inline-block; font-size:12px; font-weight:600; padding:4px 11px; border-radius:20px; background:var(--pearl2); color:var(--brown); margin:3px 5px 3px 0}
.pill.o{background:var(--orangeSoft); color:var(--orange)}
.b{font-weight:700; color:var(--ink)} .accent{color:var(--orange); font-weight:700}
.note{font-size:12.5px; color:var(--greyL); margin-top:10px}
.divider{height:1px; background:var(--line); margin:18px 0}
table.tbl{width:100%; border-collapse:collapse; font-size:13.5px}
table.tbl th{background:var(--brown); color:#fff; padding:9px 10px; text-align:left; font-weight:700}
table.tbl td{padding:8px 10px; border-bottom:1px solid var(--line2)}
table.tbl tr:nth-child(even) td{background:var(--pearl)}
.out{background:var(--pearl); border:1px solid var(--line); border-radius:var(--rs); padding:14px 16px; margin-top:12px}
.out h4{margin:0 0 6px; color:var(--orange); font-size:14px}
.svgwrap{background:#fff; border:1px solid var(--line); border-radius:var(--rs); padding:12px; overflow-x:auto; margin-top:12px}
.loader{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--pearl); z-index:100}
.spin{width:38px; height:38px; border:4px solid var(--orangeSoft); border-top-color:var(--orange); border-radius:50%; animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.mobnav{display:none}
/* ---------- responsive ---------- */
@media(max-width:860px){
 .side{display:none} .main{padding:16px}
 .g2,.g3,.g4{grid-template-columns:1fr}
 .mobnav{display:block; position:sticky; top:58px; z-index:30; background:var(--pearl2); border-bottom:1px solid var(--line); padding:8px; overflow-x:auto; white-space:nowrap}
 .mobnav a{display:inline-block; padding:7px 12px; margin-right:5px; border-radius:20px; font-size:13px; font-weight:600; color:var(--brown); background:#fff; border:1px solid var(--line)}
 .mobnav a.on{background:var(--orange); color:#fff}
}
@media(min-width:861px){ .g3.auto{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))} }
.footer{text-align:center; color:var(--greyL); font-size:12px; padding:24px}
.fig22{width:100%;height:auto;background:#FBF8F2;border:1px solid var(--line);border-radius:8px;margin:6px 0}.bmdwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#FBF8F2}.bmdsvg{width:100%;min-width:640px;height:auto;display:block}
</style>

.bmc textarea{min-height:92px;font-size:13px;padding:7px}
.bmc .w2{grid-column:span 2}.bmc .r2{grid-row:span 2}

.flag.ok{background:var(--sageSoft);color:#4f6137}
